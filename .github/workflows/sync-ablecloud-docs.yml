name: Sync ABLESTACK Docs

on:
  workflow_dispatch:
  schedule:
    # Every Monday 09:17 KST (00:17 UTC)
    - cron: "17 0 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-ablestack-docs
  cancel-in-progress: false

jobs:
  sync:
    # Do not publish upstream material until redistribution is authorized.
    if: vars.ALLOW_DOCS_REPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official Docs
        run: python scripts/sync_docs.py

      - name: Export Markdown snapshot
        run: python scripts/export_knowledge.py

      - name: Verify search works
        run: |
          python scripts/search_knowledge.py "스토리지" --limit 3

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A knowledge/docs knowledge/source-manifest.json
          if git diff --cached --quiet; then
            echo "No official Docs changes."
            exit 0
          fi
          git commit -m "docs: sync official ABLESTACK knowledge"
          git push
